# Release: a pushed tag v<version> builds the release zip and publishes it, with
# its .sha256, as a GitHub release. It uses only the workflow's own GITHUB_TOKEN and never runs the
# game. The checkout keeps full history, so the tag check refuses a tag whose commit is not on
# origin/main (a release does not wait on CI, so it ships only what main's history holds) and the
# release build compares with every earlier release tag. The T16 workflow scan (tools/tn_static.py)
# checks this file.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.3"
      - name: Install luaparser and the linter
        run: |
          python -m pip install --disable-pip-version-check -r tools/lint/requirements.txt
          python tools/lint/fetch_linter.py --dest "$env:RUNNER_TEMP\luacheck" --github-env "$env:GITHUB_ENV"
      - name: Check the tag against info.json
        env:
          TAG: ${{ github.ref_name }}
        run: python tools/build_zip.py --check-tag "$env:TAG"
      - name: Build the release zip
        run: python tools/build_zip.py --release
      - name: Publish the GitHub release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = @(Get-ChildItem -Path dist -File | Where-Object { $_.Name -like "*.zip" -or $_.Name -like "*.zip.sha256" } | ForEach-Object { $_.FullName })
          if ($files.Count -ne 2) { throw "expected the zip and its .sha256 in dist, found $($files.Count) files" }
          gh release create "$env:TAG" @files --title "$env:TAG" --notes "The mod zip and its sha256. Install: place the zip in the Factorio mods folder." --verify-tag
