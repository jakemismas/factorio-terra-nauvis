# CI: on every push and pull request, the T16 static rows and the mod zip as an
# artifact. It never runs the game, needs no workspace and reads no secret. The checkout keeps full
# history, so the static append-only row can read origin/main (and a pull request's base) and
# fails closed without it. The T16 workflow scan (tools/tn_static.py) checks this file.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-and-zip:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.3"
      - name: Install luaparser and the linter
        run: |
          python -m pip install --disable-pip-version-check -r tools/lint/requirements.txt
          python tools/lint/fetch_linter.py --dest "$env:RUNNER_TEMP\luacheck" --github-env "$env:GITHUB_ENV"
      - name: Static checks
        run: python tools/earth_test.py static
      - name: Build the zip
        run: python tools/build_zip.py
      - name: Upload the zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mod-zip
          path: dist/*.zip
          if-no-files-found: error
