[mod-name]
terra-nauvis=Terra Nauvis

[mod-description]
terra-nauvis=Earth maps for Nauvis, generated entirely in noise. This build: the real coastlines of Europe, the Atlantic world and the Old World at map scales 1 to 6 in an endless deep ocean, with their great rivers, straits and canals carved wide enough for ships and walkable fords across the rivers, Earth climate with or without Alien Biomes, marshes and great forests, with the base game's trees, rocks and plants beside Alien Biomes, as the Terra Nauvis: Europe, Terra Nauvis: Atlantic and Terra Nauvis: Old World presets and Map types, with a Europe world's spawn at a chosen or random city beside a lake.

[mod-setting-name]
terra-nauvis-scale=Map scale
terra-nauvis-spawn-city-europe=Spawn city: Europe
terra-nauvis-spawn-city-atlantic=Spawn city: Atlantic
terra-nauvis-spawn-city-old-world=Spawn city: Old World
terra-nauvis-canals=Canals
terra-nauvis-great-forests=Great forests
terra-nauvis-ridges=Ridges
terra-nauvis-hotspots=Ore hotspots

[mod-setting-description]
terra-nauvis-scale=Tiles per reference pixel of the EarthMaps raster, 1 to 6. A world made from a Terra Nauvis preset keeps the scale it was created with, so changing this setting never moves it. A world that uses a Terra Nauvis map type alone (picked in the Terrain tab without the preset) follows this setting at every load: changing it moves the terrain of the chunks that world generates afterwards, which then no longer meet the chunks it already has.
terra-nauvis-spawn-city-europe=The city a Terra Nauvis: Europe world spawns at: the map moves so the city sits at the spawn, with land around it, a lake nearby and the starting ore and enemy-free area of the base game. Random picks one of the 40 cities from the map seed. A world made from the Terra Nauvis: Europe preset keeps the spawn city it was created with, so changing this setting never moves it. A world that uses the Terra Nauvis: Europe map type alone (picked in the Terrain tab without the preset) follows this setting at every load: changing it moves the terrain of the chunks that world generates afterwards, which then no longer meet the chunks it already has.
terra-nauvis-spawn-city-atlantic=The city a new Terra Nauvis: Atlantic world spawns at: the map moves so the city sits at the spawn, with land around it, a lake in view and the starting ore and enemy-free area as in the base game. Random picks one of the 50 cities from the map seed. A world keeps its spawn city for life; a changed setting applies to new worlds only, except a world made from the Map type entry alone, which follows it.
terra-nauvis-spawn-city-old-world=The city a new Terra Nauvis: Old World world spawns at: the map moves so the city sits at the spawn, with land around it, a lake in view and the starting ore and enemy-free area as in the base game. Random picks one of the 30 cities from the map seed. A world keeps its spawn city for life; a changed setting applies to new worlds only, except a world made from the Map type entry alone, which follows it.
terra-nauvis-canals=Open the Kiel and Corinth canals on every map, Suez on the Atlantic and Old World maps and Panama on the Atlantic map, as sea-level channels at least 7 tiles wide that Cargo Ships can use. Off keeps every isthmus closed by land. A world made from a Terra Nauvis preset keeps its canals for life; a changed setting applies to new worlds only, except a world made from the Map type entry alone, which follows it.
terra-nauvis-great-forests=Grow the 16 great forests of Earth, from the Black Forest and the Scandinavian taiga to the Congo and the Amazon on the maps that hold them, with about twice the trees of the land around them. Trees still follow the climate, so a forest in a cold or dry place stays thinner. A world made from a Terra Nauvis preset keeps its great forests for life; a changed setting applies to new worlds only.
terra-nauvis-ridges=Cliff ridges along 16 mountain ranges, from the Alps, the Pyrenees and the Carpathians to the Urals, the Himalayas and the Andes, the only cliffs on the map, with passes at their historic crossings and a gap at least every 400 km, each wide enough for a double track; no ridge crosses the starting area. Off gives a map with no cliffs. A world made from a Terra Nauvis preset keeps its ridges for life; a changed setting applies to new worlds only.
terra-nauvis-hotspots=Historical ore fields at their real sites, from Kiruna, the Ruhr and the Donbas to Ghawar and the Copperbelt: dense ore in a disc that moves a little with the map seed, with about three times the base game's biter nests inside it, and offshore oil fields on deep water where the Oil Rig mod is installed. The base ore sliders still work: size and richness grow or shrink the fields, size none removes them. No field lies at a spawn city. Off gives the base game's ore. A world made from a Terra Nauvis preset keeps its hotspots for life; a changed setting applies to new worlds only.

