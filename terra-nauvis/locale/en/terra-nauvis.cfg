[map-gen-preset-name]
terra-nauvis-europe=Terra Nauvis: Europe

[map-gen-preset-description]
terra-nauvis-europe=Europe's real coastline at the map scale set in Mod settings, in an endless deep ocean, with the spawn at the city set there. A world made from this preset keeps its scale and spawn city for life.

[noise-expression]
tn_elevation_europe_v2=Terra Nauvis: Europe

[terra-nauvis]
map-type-notice=Terra Nauvis: this world uses the __1__ map type alone, so it has Europe's coast and spawn with the base game's climate, and a changed map scale or spawn city setting can move the terrain of chunks generated after it. Start a new game with the __1__ preset for Earth climate, ridges and hotspots in a map that keeps its values for life.
map-type-notice-withheld=Terra Nauvis: this world uses the __1__ map type alone, so it has Europe's coast and spawn with the base game's climate, and a changed map scale or spawn city setting can move the terrain of chunks generated after it. The __1__ preset, which adds Earth climate, ridges and hotspots in a map that keeps its values for life, is not offered beside Alien Biomes in this version.
drift-scale=Terra Nauvis: this world keeps map scale __1__ for life, as every world made from a Terra Nauvis preset does; the scale setting (now __2__) applies to new worlds and to worlds that use a Terra Nauvis map type alone.
drift-follows=Terra Nauvis: this world uses the __1__ map type alone, so it follows the changed setting: __2__ is now __3__ (was __4__). New chunks may not match the old ones.
drift-update=Terra Nauvis: this world uses the __1__ map type alone, so it follows this version of the mod: __2__ is now __3__ (was __4__). New chunks may not match the old ones.
missing-name=Terra Nauvis: the save's map key __1__ names __2__, which this version does not define. New chunks will not match the map.
withheld-beside=Terra Nauvis: this world was made from the __1__ preset, which this version does not offer beside __2__. __2__ reads the world's elevation where it places its entities, so from now on every new chunk evaluates the full coastline there and generates more slowly than the preset is built for.
start-message=Spawn city: __1__. World size: __2__ x __3__ tiles.
rso-warning=Terra Nauvis: RSO (rso-mod __1__) is active. Terra Nauvis maps do not support RSO: it replaces the map's ore with its own, so starting ore and ore hotspots may not match the map. The game continues.
drift-city=Terra Nauvis: this world keeps spawn city __1__ for life, as every world made from a Terra Nauvis preset does; the spawn city setting (now __2__) applies to new worlds and to worlds that use a Terra Nauvis map type alone.
