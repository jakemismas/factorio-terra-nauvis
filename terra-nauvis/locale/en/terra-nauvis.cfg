[map-gen-preset-name]
terra-nauvis-europe=Terra Nauvis: Europe
terra-nauvis-atlantic=Terra Nauvis: Atlantic
terra-nauvis-old-world=Terra Nauvis: Old World

[map-gen-preset-description]
terra-nauvis-europe=Europe's real coastline at the map scale set in Mod settings, in an endless deep ocean: 2,400 x 1,704 tiles at scale 1 up to 14,400 x 10,224 tiles at scale 6, with the spawn at the city set there; its great rivers, straits and canals are open to ships, with walkable fords across the rivers. A world made from this preset keeps its scale and spawn city for life.
terra-nauvis-atlantic=The Atlantic world, the Americas, Europe, Africa and Asia, with its real coastlines at the map scale set in Mod settings, in an endless deep ocean: 15,689 x 6,524 tiles at scale 1 up to 94,134 x 39,144 tiles at scale 6; its great rivers, straits and canals are open to ships, with walkable fords across the rivers. The world keeps its scale for life.
terra-nauvis-old-world=The Old World, Europe, Africa and Asia, with its real coastlines at the map scale set in Mod settings, in an endless deep ocean: 8,963 x 5,847 tiles at scale 1 up to 53,778 x 35,082 tiles at scale 6; its great rivers, straits and canals are open to ships, with walkable fords across the rivers. The world keeps its scale for life.

