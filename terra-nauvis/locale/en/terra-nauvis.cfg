[map-gen-preset-description]
terra-nauvis-europe=Europe's real coastline at the map scale set in Mod settings, in an endless deep ocean: 2,400 x 1,704 tiles at scale 1 up to 57,600 x 40,896 tiles at scale 24, with the spawn at the city set there; its straits and canals are open to ships, as are its great rivers at map scale 6, with walkable fords across the rivers. A world made from this preset keeps its scale and spawn city for life. For comparison, two reported community examples, not measurements: a 1k SPM factory core blueprint covers 683 x 813 tiles, and a 9.45k SPM megabase with every outpost fit in a 10,000 x 6,000 tile map.
terra-nauvis-atlantic=The Atlantic world, the Americas, Europe, Africa and Asia, with its real coastlines at the map scale set in Mod settings, in an endless deep ocean: 15,689 x 6,524 tiles at scale 1 up to 376,536 x 156,576 tiles at scale 24, with the spawn at the city set there; its straits and canals are open to ships, and its 32 great rivers, from the Rhine and the Danube to the Amazon, Nile, Mississippi and Congo, run from their upper reaches to the sea, with walkable fords across them. A world made from this preset keeps its scale and spawn city for life. For comparison, two reported community examples, not measurements: a 1k SPM factory core blueprint covers 683 x 813 tiles, and a 9.45k SPM megabase with every outpost fit in a 10,000 x 6,000 tile map.
terra-nauvis-old-world=The Old World, Europe, Africa and Asia, with its real coastlines at the map scale set in Mod settings, in an endless deep ocean: 8,963 x 5,847 tiles at scale 1 up to 215,112 x 140,328 tiles at scale 24, with the spawn at the city set there; its straits and canals are open to ships, as are its great rivers at map scale 6, with walkable fords across the rivers. A world made from this preset keeps its scale and spawn city for life. For comparison, two reported community examples, not measurements: a 1k SPM factory core blueprint covers 683 x 813 tiles, and a 9.45k SPM megabase with every outpost fit in a 10,000 x 6,000 tile map.

