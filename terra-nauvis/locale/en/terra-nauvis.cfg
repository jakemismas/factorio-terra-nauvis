[mod-name]
terra-nauvis=Terra Nauvis

[mod-description]
terra-nauvis=Earth maps for Nauvis, generated entirely in noise. Early build: one placeholder preset, Terra Nauvis: Europe.

[mod-setting-name]
terra-nauvis-scale=Map scale

[mod-setting-description]
terra-nauvis-scale=Tiles per reference pixel of the EarthMaps raster, 1 to 6. The Earth maps of later builds read it; the placeholder preset of this build does not.

[string-mod-setting]
terra-nauvis-scale-1=1 tile per pixel
terra-nauvis-scale-2=2 tiles per pixel
terra-nauvis-scale-3=3 tiles per pixel
terra-nauvis-scale-4=4 tiles per pixel
terra-nauvis-scale-5=5 tiles per pixel
terra-nauvis-scale-6=6 tiles per pixel

[map-gen-preset-name]
terra-nauvis-europe=Terra Nauvis: Europe

[map-gen-preset-description]
terra-nauvis-europe=Placeholder: a land box the size of Europe at scale 6 in an endless ocean. The real map arrives in a later build.
