[mod-name]
terra-nauvis=Terra Nauvis: Earth Maps

[mod-description]
terra-nauvis=Play on Earth. Three maps of the real world (Europe, the Old World, the Atlantic) with real coastlines, rivers, mountain ranges and ore fields, in eight sizes.

