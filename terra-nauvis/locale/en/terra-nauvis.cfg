tn_elevation_europe_v5=Terra Nauvis: Europe
tn_elevation_atlantic_v4=Terra Nauvis: Atlantic
tn_elevation_olde_world_v4=Terra Nauvis: Old World

[terra-nauvis]
map-type-notice=Terra Nauvis: this world uses the __1__ map type alone, so it has that map's coast, rivers and spawn with the base game's climate, and a changed map scale or spawn city setting can move the terrain of chunks generated after it. Start a new game with the __1__ preset for Earth climate, ridges, hotspots and river fords in a map that keeps its values for life.
map-type-notice-withheld=Terra Nauvis: this world uses the __1__ map type alone, so it has that map's coast, rivers and spawn with the base game's climate, and a changed map scale or spawn city setting can move the terrain of chunks generated after it. The __1__ preset, which adds Earth climate, ridges, hotspots and river fords in a map that keeps its values for life, is not offered beside Alien Biomes in this version.
drift-scale=Terra Nauvis: this world keeps map scale __1__ for life, as every world made from a Terra Nauvis preset does; the scale setting (now __2__) applies to new worlds and to worlds that use a Terra Nauvis map type alone.
drift-follows=Terra Nauvis: this world uses the __1__ map type alone, so it follows the changed setting: __2__ is now __3__ (was __4__). New chunks may not match the old ones.
drift-update=Terra Nauvis: this world uses the __1__ map type alone, so it follows this version of the mod: __2__ is now __3__ (was __4__). New chunks may not match the old ones.
missing-name=Terra Nauvis: the save's map key __1__ names __2__, which this version does not define. New chunks will not match the map.
withheld-beside=Terra Nauvis: this world was made from the __1__ preset by a version of Terra Nauvis that did not support __2__ there. __2__ reads the world's elevation where it places its entities, so every new chunk evaluates the full coastline there and generates more slowly than the preset is built for, for the life of this world.
start-message=Spawn city: __1__. World size: __2__ x __3__ tiles.
rso-warning=Terra Nauvis: RSO (rso-mod __1__) is active. Terra Nauvis maps do not support RSO: it replaces the map's ore with its own, so starting ore and ore hotspots may not match the map. The game continues.
drift-city=Terra Nauvis: this world keeps spawn city __1__ for life, as every world made from a Terra Nauvis preset does; the spawn city setting (now __2__) applies to new worlds and to worlds that use a Terra Nauvis map type alone.
drift-toggle=Terra Nauvis: this world keeps __1__ __2__ for life, as every world made from a Terra Nauvis preset does; the setting (now __3__) applies to new worlds and to worlds that use a Terra Nauvis map type alone.
toggle-on=on
toggle-off=off
cliff-reset=Terra Nauvis: the cliffs slider was set to none, which would stop every ridge, so __1__ is back at size __2__ for every chunk generated from now on; the starting area keeps no cliffs.
