[mod-name]
terra-nauvis=Terra Nauvis

[mod-description]
terra-nauvis=Earth maps for Nauvis, generated entirely in noise. This build: Europe's real coastline at map scales 1 to 6 in an endless deep ocean, with the spawn at a chosen or random city beside a lake, as the Terra Nauvis: Europe preset and Map type (beside Alien Biomes, the Map type only).

[mod-setting-name]
terra-nauvis-scale=Map scale
terra-nauvis-spawn-city-europe=Spawn city: Europe

[mod-setting-description]
terra-nauvis-scale=Tiles per reference pixel of the EarthMaps raster, 1 to 6. A world made from a Terra Nauvis preset keeps the scale it was created with, so changing this setting never moves it. A world that uses a Terra Nauvis map type alone (picked in the Terrain tab without the preset) follows this setting at every load: changing it moves the terrain of the chunks that world generates afterwards, which then no longer meet the chunks it already has.
terra-nauvis-spawn-city-europe=The city a Terra Nauvis: Europe world spawns at: the map moves so the city sits at the spawn, with land around it, a lake nearby and the starting ore and enemy-free area of the base game. Random picks one of the 40 cities from the map seed. A world made from the Terra Nauvis: Europe preset keeps the spawn city it was created with, so changing this setting never moves it. A world that uses the Terra Nauvis: Europe map type alone (picked in the Terrain tab without the preset) follows this setting at every load: changing it moves the terrain of the chunks that world generates afterwards, which then no longer meet the chunks it already has.

