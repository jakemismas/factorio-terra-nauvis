[mod-setting-description]
terra-nauvis-koppen=On by default. Draws each world's ground, trees and decoratives from its Koppen-Geiger climate class, computed per tile from four climate fields: annual mean temperature, coldest-month and warmest-month temperature, and a precipitation measure. Fourteen classes span the world, from tropical rainforest and hot desert through Mediterranean, oceanic and continental to boreal taiga, tundra and ice cap, each with its own ground and plants and in-class variety. Off keeps the continuous Terra Nauvis 0.3.2 climate. A world made from a Terra Nauvis preset keeps this for life; a changed setting applies to new worlds only.
terra-nauvis-scale=How big the world is: the number of tiles each pixel of the EarthMaps reference map becomes, 1 to 6, 12 or 24. Each value lists the world size of every map. For a sense of size, two reported community examples, not measurements: a 1k SPM factory core blueprint covers 683 x 813 tiles, and a 9.45k SPM megabase with every outpost fit in a 10,000 x 6,000 tile map. A world made from a Terra Nauvis preset keeps the scale it was created with, so changing this setting never moves it. A world that uses a Terra Nauvis map type alone (picked in the Terrain tab without the preset) follows this setting at every load: changing it moves the terrain of the chunks that world generates afterwards, which then no longer meet the chunks it already has.
terra-nauvis-spawn-city-europe=The city a Terra Nauvis: Europe world spawns at: the map moves so the city sits at the spawn, with land around it, a lake nearby and the starting ore and enemy-free area of the base game. Random picks one of the 40 cities from the map seed. A world made from the Terra Nauvis: Europe preset keeps the spawn city it was created with, so changing this setting never moves it. A world that uses the Terra Nauvis: Europe map type alone (picked in the Terrain tab without the preset) follows this setting at every load: changing it moves the terrain of the chunks that world generates afterwards, which then no longer meet the chunks it already has.
terra-nauvis-spawn-city-atlantic=The city a new Terra Nauvis: Atlantic game spawns at: the map moves so the city sits at the spawn, with land around it, a lake nearby and the starting ore and enemy-free area of the base game. Random picks one of the first 50 cities (not Frankfurt, Moscow or Null Island) from the map seed. A world keeps its spawn city for life; a changed setting applies to new worlds only, except a world made from the Map type entry alone, which follows it and spawns at random in place of Frankfurt, Moscow or Null Island.
terra-nauvis-spawn-city-old-world=The city a new Terra Nauvis: Old World game spawns at: the map moves so the city sits at the spawn, with land around it, a lake nearby and the starting ore and enemy-free area of the base game. Random picks one of the 33 cities from the map seed. A world keeps its spawn city for life; a changed setting applies to new worlds only, except a world made from the Map type entry alone, which follows it.
terra-nauvis-canals=Open the Kiel and Corinth canals on every map, Suez on the Atlantic and Old World maps and Panama on the Atlantic map, as sea-level channels at least 7 tiles wide that Cargo Ships can use. Off keeps every isthmus closed by land. Map generation cost at Old World scale 12: terrain +0.5 percent. A world made from a Terra Nauvis preset keeps its canals for life; a changed setting applies to new worlds only, except a world made from the Map type entry alone, which follows it.
terra-nauvis-exact-coast=On by default. As each chunk generates, a new Terra Nauvis: Atlantic or Terra Nauvis: Old World world holds its coast to the EarthMaps reference, except beside rivers, straits and canals, in the map's edge band and within 24 tiles of the spawn: the sea's channels and islets narrower than a pixel come back, land made from sea takes the trees and ground cover of the land beside it, and the map preview still shows the noise coast. Europe's map and map scales 12 and 24 keep their noise coast, and a world made from a Map type entry alone gets none of this. A world keeps this setting for life; a changed setting applies to new worlds only.
terra-nauvis-great-forests=Grow the 22 great forests of Earth, from the Black Forest and the Scandinavian taiga to the Congo, the Amazon, Borneo and New Guinea on the maps that hold them, with about twice the trees of the land around them and the cold taiga forests more. Trees still follow the climate, so a forest in a dry place stays thinner. Map generation cost at Old World scale 12: entities +10 percent, terrain none. A world made from a Terra Nauvis preset keeps its great forests for life; a changed setting applies to new worlds only.
terra-nauvis-ridges=Cliff ridges along the map's mountain ranges (10 on Europe, 21 on Old World, 26 on Atlantic), from the Alps, the Pyrenees and the Carpathians to the Urals, the Himalayas and the Andes, the only cliffs on the map, with passes at their historic crossings and a gap at least every 400 km, each wide enough for a double track; no ridge crosses the starting area. Off gives a map with no cliffs. Map generation cost at Old World scale 12: terrain +2 percent, entities +1 percent, and all of the cliff work. A world made from a Terra Nauvis preset keeps its ridges for life; a changed setting applies to new worlds only.
terra-nauvis-hotspots=Historical ore fields at their real sites, from Kiruna, the Ruhr and the Donbas to Ghawar and the Copperbelt: dense ore across a footprint that moves a little with the map seed, with about three times the base game's biter nests inside it, and offshore oil fields on deep water where the Oil Rig mod is installed. On a solid ore field the map's size slider scales its area and total and the richness slider its ore per tile, and the frequency slider does not reach it. Ordinary ore stays out of a hotspot's disc. No field lies at a spawn city. Off removes the hotspots and keeps the map's ordinary ore. Map generation cost at Old World scale 12: entities +6 percent, terrain +0.1 percent. A world made from a Terra Nauvis preset keeps its hotspots for life; a changed setting applies to new worlds only, except a world made from the Map type entry alone, whose offshore fields follow it.
terra-nauvis-hotspot-amount=How much ground each ore hotspot covers. Normal: a field holds several large ordinary patches' worth of ore, up to about 100 million, in a few big ore bodies about twice as rich per tile as the ore around it. Large and Huge add more ore bodies (two and four times the ore); Small halves it. Richness per tile stays the same. Oil hotspots get richer wells instead. Applies to new worlds.
terra-nauvis-regional-scarcity=Makes ordinary ore patches rarer away from the regions where each resource is found on Earth, so the hotspots and their regions become places worth a rail line or a ship route. Only ore farther than about 1,500 tiles from the spawn at map scale 12 changes (half that at scale 6), fading in to the full effect at about 3,000 tiles; the starting area, its starting ore and the hotspots stay the same. Whole patches drop out and the patches that remain keep their size. Medium keeps about 20 percent of the uranium patches outside its regions, 35 percent of the oil, 50 percent of the copper, 65 percent of the iron, 75 percent of the coal and 95 percent of the stone; Strong keeps 8, 15, 30, 40, 55 and 80 percent. Off places ordinary ore as before. Applies to new worlds only: a world made from a Terra Nauvis preset keeps this for life.
terra-nauvis-inland-lakes=Scatter small random lakes across the land, about eight in every 1,024 by 1,024 tiles, away from coasts and the starting area. Off leaves only the lake at the spawn city, the rivers and the real lakes of the map. Map generation cost at Old World scale 12: terrain +0.3 percent. A world made from a Terra Nauvis preset keeps its inland lakes for life; a changed setting applies to new worlds only, except a world made from the Map type entry alone, which follows it.
terra-nauvis-destroyed-europe=Needs Alien Biomes. Turns the heart of Europe into a red wasteland: France, the Low Countries, Germany, Switzerland, Austria, Poland, Slovenia to Ljubljana and Italy down to about Rome become a wasteland: a heart of Alien Biomes' cracked basalt with lava pools, volcanic rock and dead trees, with patches of black and grey rock, and where the zone meets land a broad barrier of scorched red grass, black ash and red rock that frays into normal ground. It runs to the shore on every coast and never onto water. All of it is ground you can walk and build on at full speed, and it absorbs pollution like grass. Biter and worm creep and the light brown mud and dry plants inside take a dark ember red. The outline is different on every map seed. Britain, the Danish islands and the Carpathians stay outside, while Jutland and the north German coast lie inside. A chosen spawn city inside the zone starts in it, on cooler ground with its starting ore; a random spawn city never lands inside the zone. Without Alien Biomes nothing changes and the game warns. Map generation cost at Old World scale 12: terrain +2 percent, entities +7 percent. A world made from a Terra Nauvis preset keeps its zone for life; a changed setting applies to new worlds only.
terra-nauvis-blue-corrupted=Needs Alien Biomes. Turns the UK into Alien Biomes' blue and purple lands: mostly mauve grass, with patches of blue grass, purple grass and purple dirt mixed in, and the violet, white and blue trees and plants that grow there, on every map. The sea stays sea, and in Ireland the zone stops at the border of Northern Ireland, which frays into normal ground. Biter and worm creep and the brown plants and mud inside take a blue-purple, and its dirt absorbs pollution like grass. Off by default, and it works beside Destroyed Europe. Without Alien Biomes it changes nothing. Map generation cost at Old World scale 12: terrain +1.5 percent, entities +4.5 percent. A world made from a Terra Nauvis preset keeps this for life; a changed setting applies to new worlds only.
terra-nauvis-moscow-zone=Chaos and Corrupted need Alien Biomes. A zone round Moscow, from the Baltic states, southern Finland and eastern Poland to the Volga bend and from Lakes Ladoga and Onega to the Black Sea and the Sea of Azov. Normal leaves the region as it is. Chaos turns it into a wasteland like Destroyed Europe's, cracked basalt with lava pools fading through black ash, scorched red grass and dry dirt into normal ground. Corrupted turns it into Alien Biomes' blue and purple lands like Blue corrupted UK, with their violet, white and blue trees, running straight into the snow where the north snow meets it. Either works beside Destroyed Europe and Blue corrupted UK. Without Alien Biomes it changes nothing and the game warns. A world made from a Terra Nauvis preset keeps this for life; a changed setting applies to new worlds only.
terra-nauvis-north-snow=How far south the snow of northern Eurasia reaches. Low keeps the snow line of Terra Nauvis 0.3.0: Lapland, northern Russia and Siberia beyond the Arctic circle, with taiga forest below. Medium moves the line about 6 degrees south, so snow covers northern Scandinavia, Finland and the Russian north to about 61 to 64 N, roughly twice as deep a belt. High moves it about 9 degrees south, to about 57 to 60 N, roughly three times as deep: snow over most of Scandinavia, Finland, northern European Russia and Siberia. Iceland, Greenland and the Americas keep the Low line at every level. Without Alien Biomes the same line moves the mod's frozen ground. Applies to new worlds only: a world made from a Terra Nauvis preset keeps this for life.
terra-nauvis-city-markers=Off by default. On, the map view of a world made from a Terra Nauvis preset shows the name of every city of its map at the place its spawn city uses, the cities its spawn city setting offers; off removes them. Only the map view shows them and they change nothing in the world, so it can be switched at any time in a running game. A world made from a Map type entry alone gets none.

